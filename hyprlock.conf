general {
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/wallpapers/cachyos-wallpapers/BlueFeathers.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(214, 222, 235, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(143, 188, 187, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 38
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(79, 209, 197, 0.85)
    inner_color = rgba(13, 20, 33, 0.90)
    font_color = rgba(214, 222, 235, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8ca0b8">Password</span>
    hide_input = false
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(235, 203, 139, 1.0)
    position = 0, -42
    halign = center
    valign = center
}

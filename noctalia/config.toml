[accessibility]
ui_scale = 1.10

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660

[idle.behavior.suspend]
action = "lock_and_suspend"
enabled = true
timeout = 1800

[bar.default]
start = [ "launcher", "clock", "spacer_1", "workspaces" ]
center = [ "taskbar" ]
end = [ "media", "spacer_1", "group:system", "tray", "clipboard", "screenshot", "notifications", "privacy", "caffeine", "brightness", "network", "bluetooth", "volume", "battery", "power_profile", "session" ]
thickness = 35
scale = 1.10
margin_edge = 0
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 12
radius_bottom_right = 12
concave_edge_corners = true

    [[bar.default.capsule_group]]
    id = "system"
    members = [ "temperature", "memory" ]
    fill = "on_secondary"
    border = ""
    opacity = 1.0
    padding = 6.0

[bar.default.dead_zone.actions]
left = "panel-toggle launcher"
right = "panel-toggle control-center"

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.launcher]
color = "secondary"

[widget.launcher.actions]
right = "settings-toggle"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.clock.actions]
left = "panel-toggle control-center calendar"
right = "panel-toggle control-center weather"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
scroll_repeat = "steps"
show_labels = false

[widget.taskbar]
capsule = true
capsule_fill = "on_secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.media.actions]
right = "media toggle"

[widget.temperature]
type = "sysmon"
glyph = "cpu-2"
show_value = false
stat = "cpu_temp"

[widget.memory]
type = "sysmon"
glyph = "memory"
show_value = false
stat = "ram_used"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.clipboard]
color = "secondary"

[widget.screenshot]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.notifications.actions]
right = "notification-dnd-toggle"

[widget.privacy]
color = "error"

[widget.caffeine]
color = "secondary"

[widget.brightness]
color = "secondary"

[widget.network]
color = "secondary"

[widget.bluetooth]
color = "secondary"

[widget.volume]
color = "secondary"

[widget.volume.actions]
right = "volume-mute"
scroll_up = "volume-up 5%"
scroll_down = "volume-down 5%"

[widget.battery]
color = "secondary"

[widget.power_profile]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"
